name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Gem
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log resource usage (start)
        run: |
          echo "=== Resource Usage at Start ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Build gem
        run: bundle exec rake build

      - name: Determine tag
        id: determine_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Publish gem to RubyGems
        if: env.RUBYGEMS_API_TOKEN != ''
        env:
          RUBYGEMS_API_TOKEN: ${{ secrets.RUBYGEMS_API_TOKEN }}
        run: bundle exec rake release_gem[${{ steps.determine_tag.outputs.tag }}]

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: pkg/*.gem
          generate_release_notes: true

      - name: Log resource usage (end)
        if: always()
        run: |
          echo "=== Resource Usage at End ==="
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
