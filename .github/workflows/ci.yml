name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Linting job - lightweight, runs quickly
  lint:
    name: Lint with RuboCop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log resource usage (start)
        run: |
          echo "=== Resource Usage at Start ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.0'
          bundler-cache: true

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Log resource usage (end)
        if: always()
        run: |
          echo "=== Resource Usage at End ==="
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # Test job - parallelized across Ruby versions for efficiency
  test:
    name: Test on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.6', '2.7', '3.0', '3.1', '3.2']
    steps:
      - name: Log resource usage (start)
        run: |
          echo "=== Resource Usage at Start ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run unit tests
        run: bundle exec rake test

      - name: Run specs
        run: bundle exec rspec

      - name: Log resource usage (end)
        if: always()
        run: |
          echo "=== Resource Usage at End ==="
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

  # Integration tests - may require more resources
  integration:
    name: Integration Tests on Ruby ${{ matrix.ruby }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        ruby: ['2.7', '3.0', '3.1']
    steps:
      - name: Log resource usage (start)
        run: |
          echo "=== Resource Usage at Start ==="
          echo "CPU cores: $(nproc)"
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      - name: Run integration tests
        run: bundle exec rake integration
        continue-on-error: true

      - name: Log resource usage (end)
        if: always()
        run: |
          echo "=== Resource Usage at End ==="
          echo "Memory: $(free -h)"
          echo "Disk: $(df -h)"
          echo "Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
